[project]
name = "multidevicellm"
version = "0.1.0"
description = "Run a single LLM across your phone, laptop, and other devices by pooling their memory. A friendly control layer on top of exo."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Robert" }]
keywords = ["llm", "distributed-inference", "exo", "mlx", "local-ai", "cluster"]

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
]

[project.scripts]
mdllm = "mdllm.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdllm"]

[tool.uv]
package = true
